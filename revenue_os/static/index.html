<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revenue OS — Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #0f1117; color: #e1e4ea; }
.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 240px; background: #161822; border-right: 1px solid #262a36; padding: 24px 16px; }
.sidebar h1 { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
.sidebar .subtitle { font-size: 12px; color: #6b7280; margin-bottom: 24px; }
.sidebar nav { display: flex; flex-direction: column; gap: 4px; }
.sidebar nav a { padding: 10px 12px; border-radius: 8px; color: #9ca3af; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.15s; cursor: pointer; }
.sidebar nav a:hover, .sidebar nav a.active { background: #1f2937; color: #fff; }
.main { margin-left: 240px; padding: 32px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
.header h2 { font-size: 24px; font-weight: 700; }
.header .user { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #9ca3af; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 32px; }
.card { background: #1a1d28; border: 1px solid #262a36; border-radius: 12px; padding: 20px; }
.card .label { font-size: 12px; font-weight: 500; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.card .value { font-size: 28px; font-weight: 700; color: #fff; }
.card .value.green { color: #22c55e; }
.card .value.blue { color: #3b82f6; }
.card .value.yellow { color: #eab308; }
.card .value.red { color: #ef4444; }
.section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; margin-top: 24px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #262a36; }
td { padding: 12px; font-size: 14px; border-bottom: 1px solid #1f2937; }
.status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
.status-lead { background: #1e3a5f; color: #60a5fa; }
.status-qualified { background: #1e3a2f; color: #4ade80; }
.status-customer { background: #3b2f1e; color: #fbbf24; }
.status-prospect { background: #2a1e3a; color: #c084fc; }
.status-won { background: #1e3a2f; color: #4ade80; }
.status-lost { background: #3a1e1e; color: #f87171; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; transition: all 0.15s; }
.btn-primary { background: #3b82f6; color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-outline { background: transparent; border: 1px solid #374151; color: #9ca3af; }
.btn-outline:hover { border-color: #6b7280; color: #fff; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 100; }
.modal.open { display: flex; }
.modal-content { background: #1a1d28; border: 1px solid #262a36; border-radius: 16px; padding: 24px; width: 480px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
.modal-content h3 { font-size: 18px; margin-bottom: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; color: #9ca3af; margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #374151; background: #0f1117; color: #e1e4ea; font-size: 14px; font-family: inherit; }
.form-group textarea { resize: vertical; min-height: 60px; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.toast { position: fixed; bottom: 24px; right: 24px; background: #22c55e; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.3s; z-index: 200; }
.toast.show { opacity: 1; }
.toast.error { background: #ef4444; }
@media (max-width: 768px) { .sidebar { display: none; } .main { margin-left: 0; padding: 16px; } }
</style>
</head>
<body>
<div class="sidebar">
  <h1>Revenue OS</h1>
  <div class="subtitle" id="userInfo">Loading...</div>
  <nav>
    <a class="active" onclick="showPage('dashboard')">Dashboard</a>
    <a onclick="showPage('contacts')">Contacts</a>
    <a onclick="showPage('deals')">Deals</a>
    <a onclick="showPage('outreach')">Outreach</a>
    <a onclick="showPage('search')">Search</a>
  </nav>
</div>

<div class="main" id="page-dashboard">
  <div class="header">
    <h2>Command Center</h2>
    <div class="user"><span id="dashTime"></span></div>
  </div>
  <div class="grid" id="kpiGrid"></div>
  <h3 class="section-title">Recent Activity</h3>
  <table><thead><tr><th>Type</th><th>Subject</th><th>Time</th></tr></thead><tbody id="recentActivity"></tbody></table>
</div>

<div class="main" id="page-contacts" style="display:none">
  <div class="header"><h2>Contacts</h2><button class="btn btn-primary" onclick="openContactModal()">+ Add Contact</button></div>
  <table><thead><tr><th>Name</th><th>Email</th><th>Designation</th><th>Status</th><th>Score</th></tr></thead><tbody id="contactsTable"></tbody></table>
</div>

<div class="main" id="page-deals" style="display:none">
  <div class="header"><h2>Deals</h2><button class="btn btn-primary" onclick="openDealModal()">+ Add Deal</button></div>
  <table><thead><tr><th>Name</th><th>Stage</th><th>Value</th><th>Probability</th><th>Weighted</th></tr></thead><tbody id="dealsTable"></tbody></table>
</div>

<div class="main" id="page-outreach" style="display:none">
  <div class="header"><h2>Outreach Sequences</h2></div>
  <table><thead><tr><th>Name</th><th>Channel</th><th>Steps</th><th>Active</th></tr></thead><tbody id="sequencesTable"></tbody></table>
</div>

<div class="main" id="page-search" style="display:none">
  <div class="header"><h2>Search</h2></div>
  <div style="display:flex;gap:8px;margin-bottom:16px">
    <input type="text" id="searchInput" placeholder="Search contacts, deals, notes..." style="flex:1;padding:10px 12px;border-radius:8px;border:1px solid #374151;background:#0f1117;color:#e1e4ea;font-size:14px;">
    <button class="btn btn-primary" onclick="doSearch()">Search</button>
  </div>
  <div id="searchResults"></div>
</div>

<div class="modal" id="contactModal">
  <div class="modal-content">
    <h3>New Contact</h3>
    <div class="form-group"><label>First Name</label><input id="cfName" placeholder="John"></div>
    <div class="form-group"><label>Last Name</label><input id="clName" placeholder="Doe"></div>
    <div class="form-group"><label>Email</label><input id="cEmail" placeholder="john@example.com"></div>
    <div class="form-group"><label>Designation</label><input id="cDesignation" placeholder="CEO"></div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal('contactModal')">Cancel</button>
      <button class="btn btn-primary" onclick="createContact()">Create</button>
    </div>
  </div>
</div>

<div class="modal" id="dealModal">
  <div class="modal-content">
    <h3>New Deal</h3>
    <div class="form-group"><label>Name</label><input id="dName" placeholder="Enterprise License"></div>
    <div class="form-group"><label>Value</label><input id="dValue" type="number" placeholder="10000"></div>
    <div class="form-group"><label>Stage</label>
      <select id="dStage">
        <option value="discovery">Discovery</option>
        <option value="qualified">Qualified</option>
        <option value="proposal">Proposal</option>
        <option value="negotiation">Negotiation</option>
      </select>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal('dealModal')">Cancel</button>
      <button class="btn btn-primary" onclick="createDeal()">Create</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/v1';
let token = localStorage.getItem('token');

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (token) opts.headers['Authorization'] = `Bearer ${token}`;
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(`${API}${path}`, opts);
  if (r.status === 401) { showToast('Session expired', 'error'); token = null; localStorage.removeItem('token'); showAuth(); return null; }
  if (!r.ok) { const err = await r.json().catch(()=>({})); showToast(err.detail || 'Request failed', 'error'); return null; }
  return r.status === 204 ? {} : r.json();
}

function showToast(msg, type) {
  const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show' + (type === 'error' ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function login() {
  const email = prompt('Email:');
  if (!email) return;
  const password = prompt('Password:');
  if (!password) return;
  const r = await fetch(`${API}/auth/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  if (!r.ok) { showToast('Login failed', 'error'); return; }
  const data = await r.json();
  token = data.access_token;
  localStorage.setItem('token', token);
  document.getElementById('userInfo').textContent = data.full_name || data.email;
  init();
}

async function checkAuth() {
  if (!token) { await login(); return; }
  const user = await api('GET', '/auth/me');
  if (!user) { await login(); return; }
  document.getElementById('userInfo').textContent = user.full_name || user.email;
}

function showPage(name) {
  document.querySelectorAll('.main').forEach(p => p.style.display = 'none');
  document.getElementById(`page-${name}`).style.display = 'block';
  document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
  document.querySelector(`.sidebar nav a[onclick*='${name}']`)?.classList.add('active');
  if (name === 'dashboard') loadDashboard();
  if (name === 'contacts') loadContacts();
  if (name === 'deals') loadDeals();
  if (name === 'outreach') loadSequences();
}

async function loadDashboard() {
  const d = await api('GET', '/command-center');
  if (!d) return;
  document.getElementById('dashTime').textContent = new Date().toLocaleString();

  const kpis = [
    { label: 'Pipeline Value', value: `$${(d.revenue?.pipeline_value || 0).toLocaleString()}`, cls: 'blue' },
    { label: 'Won Revenue', value: `$${(d.revenue?.won_revenue || 0).toLocaleString()}`, cls: 'green' },
    { label: 'Active Deals', value: d.pipeline?.active_deals || 0, cls: '' },
    { label: 'Win Rate', value: `${d.pipeline?.win_rate || 0}%`, cls: 'green' },
    { label: 'Total Contacts', value: d.contacts?.total || 0, cls: '' },
    { label: 'Qualified', value: d.contacts?.qualified || 0, cls: 'blue' },
    { label: 'Customers', value: d.contacts?.customers || 0, cls: 'green' },
    { label: 'AR/AP Due', value: `$${(d.revenue?.total_outstanding || 0).toLocaleString()}`, cls: 'yellow' },
  ];
  document.getElementById('kpiGrid').innerHTML = kpis.map(k =>
    `<div class="card"><div class="label">${k.label}</div><div class="value ${k.cls}">${k.value}</div></div>`
  ).join('');

  const tbody = document.getElementById('recentActivity');
  tbody.innerHTML = (d.recent_activity || []).map(a =>
    `<tr><td><span class="status-badge">${a.type}</span></td><td>${a.subject || ''}</td><td>${new Date(a.performed_at).toLocaleString()}</td></tr>`
  ).join('') || '<tr><td colspan="3">No recent activity</td></tr>';
}

async function loadContacts() {
  const data = await api('GET', '/contacts?limit=100');
  if (!data) return;
  const tbody = document.getElementById('contactsTable');
  tbody.innerHTML = data.map(c =>
    `<tr>
      <td><strong>${c.full_name || `${c.first_name} ${c.last_name}`}</strong></td>
      <td>${c.email || ''}</td>
      <td>${c.designation || ''}</td>
      <td><span class="status-badge status-${c.status}">${c.status}</span></td>
      <td>${c.lead_score}</td>
    </tr>`
  ).join('') || '<tr><td colspan="5">No contacts yet</td></tr>';
}

async function loadDeals() {
  const data = await api('GET', '/deals?limit=100');
  if (!data) return;
  const tbody = document.getElementById('dealsTable');
  tbody.innerHTML = data.map(d =>
    `<tr>
      <td><strong>${d.name}</strong></td>
      <td><span class="status-badge status-${d.stage === 'closed_won' ? 'won' : d.stage === 'closed_lost' ? 'lost' : ''}">${d.stage}</span></td>
      <td>$${(d.value || 0).toLocaleString()}</td>
      <td>${d.probability}%</td>
      <td>$${((d.value || 0) * (d.probability || 0) / 100).toLocaleString()}</td>
    </tr>`
  ).join('') || '<tr><td colspan="5">No deals yet</td></tr>';
}

async function loadSequences() {
  const data = await api('GET', '/outreach/sequences');
  if (!data) return;
  const tbody = document.getElementById('sequencesTable');
  tbody.innerHTML = data.map(s =>
    `<tr>
      <td><strong>${s.name}</strong></td>
      <td>${s.channel}</td>
      <td>${s.steps_count}</td>
      <td>${s.is_active ? 'Active' : 'Inactive'}</td>
    </tr>`
  ).join('') || '<tr><td colspan="4">No sequences yet</td></tr>';
}

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  const data = await api('GET', `/contacts/search?q=${encodeURIComponent(q)}&limit=20`);
  const container = document.getElementById('searchResults');
  if (!data || data.length === 0) { container.innerHTML = '<p style="color:#6b7280">No results found</p>'; return; }
  container.innerHTML = data.map(h =>
    `<div class="card" style="margin-bottom:8px">
      <strong>${h.metadata?.name || h.id}</strong>
      <div style="font-size:13px;color:#6b7280;margin-top:4px">${h.metadata?.type || ''} — ${h.snippet || ''}</div>
    </div>`
  ).join('');
}

function openContactModal() { document.getElementById('contactModal').classList.add('open'); }
function openDealModal() { document.getElementById('dealModal').classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

async function createContact() {
  const body = {
    first_name: document.getElementById('cfName').value,
    last_name: document.getElementById('clName').value,
    email: document.getElementById('cEmail').value,
    designation: document.getElementById('cDesignation').value,
  };
  if (!body.first_name || !body.last_name) { showToast('Name is required', 'error'); return; }
  await api('POST', '/contacts', body);
  closeModal('contactModal');
  showToast('Contact created');
  loadContacts();
}

async function createDeal() {
  const name = document.getElementById('dName').value;
  if (!name) { showToast('Name is required', 'error'); return; }
  const pipelines = await api('GET', '/deals/pipelines');
  if (!pipelines || pipelines.length === 0) { showToast('Create a pipeline first via API', 'error'); return; }
  await api('POST', '/deals', {
    pipeline_id: pipelines[0].id,
    name,
    value: parseFloat(document.getElementById('dValue').value) || 0,
    stage: document.getElementById('dStage').value,
  });
  closeModal('dealModal');
  showToast('Deal created');
  loadDeals();
}

async function init() {
  await checkAuth();
  if (token) loadDashboard();
}
init();
</script>
</body>
</html>
