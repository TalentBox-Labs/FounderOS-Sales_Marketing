version: "3.9"

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: revenue_os_demo
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata_demo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d revenue_os_demo"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - demo_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - demo_network

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://demo_user:demo_pass@db:5432/revenue_os_demo
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: demo-secret-key-change-in-production-12345678901234567890
      OPENAI_API_KEY: sk-demo-key-not-configured
      ENVIRONMENT: demo
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/chroma:/app/data/chroma
      - ./output:/app/output
    networks:
      - demo_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: celery -A revenue_os.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://demo_user:demo_pass@db:5432/revenue_os_demo
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: demo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demo_network
    restart: on-failure

  beat:
    build: .
    command: celery -A revenue_os.tasks.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://demo_user:demo_pass@db:5432/revenue_os_demo
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: demo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demo_network
    restart: on-failure

volumes:
  pgdata_demo:

networks:
  demo_network:
    driver: bridge
