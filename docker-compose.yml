version: "3.9"

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: revenue_os
      POSTGRES_USER: cyril.s.thomas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyril.s.thomas -d revenue_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cyril.s.thomas:${POSTGRES_PASSWORD:-postgres}@db:5432/revenue_os
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chroma_data:/app/data

  worker:
    build: .
    command: celery -A revenue_os.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://cyril.s.thomas:${POSTGRES_PASSWORD:-postgres}@db:5432/revenue_os
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A revenue_os.tasks.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://cyril.s.thomas:${POSTGRES_PASSWORD:-postgres}@db:5432/revenue_os
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  chroma_data:
