repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.25.1
    hooks:
      - id: gitleaks
        args: ["--redact"]

  - repo: local
    hooks:
      - id: fixture-verify
        name: Verify week fixtures sync
        entry: ./.venv/bin/python scripts/generate_week_fixtures.py --verify
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Run pytest
        entry: ./.venv/bin/python -m pytest tests/ -q
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
        require_serial: true
