name: Tests & Fixture Verification

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: revenue_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-api.txt -r requirements-revenue.txt

    - name: Run tests
      run: |
        python -m pytest tests/ -v
      env:
        SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/revenue_os

    - name: Verify fixture sync (no writes allowed)
      run: |
        python scripts/generate_week_fixtures.py --verify
      env:
        # Prevent accidental writes in CI
        CI: "true"
